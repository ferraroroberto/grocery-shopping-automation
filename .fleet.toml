# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The gate
# (scripts/verify-before-ship.ps1) runs scripts/static_ratchet.py through
# scripts/static_ratchet_gate.py: a duplicate block (jscpd via npx, Python and JS), an
# unused import/variable (ruff F401,F841) or a likely-bug or security pattern (the curated
# ruff B and S families, S113 included) that is not in .static-ratchet-baseline.json
# fails. Needs Node and ruff in the gate's venv; a detector that cannot run exits 3,
# which fails the gate. Vendored copies are duplicates by design, so they are excluded;
# so are the per-stage gate wrappers and their tests, one scaffold-templated file per
# ratchet that differ only in the stage name and messages.
# Procedure + limits: project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"
exclude  = ["**/_vendored/**", "scripts/*_ratchet_gate.py", "tests/ratchet_gates/**"]

# [docs_ratchet] -- the scaffold's baseline-and-ratchet docs stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/docs_ratchet.py through
# scripts/docs_ratchet_gate.py: README.md past 40 KiB or past its baselined size,
# or a new issue reference, dated heading or changelog heading in README.md or
# docs/**/*.md beyond .docs-ratchet-baseline.json, fails. A scan that cannot
# complete exits 3, which fails the gate. Docs state the present-tense why;
# history belongs to git, PRs and issues. Procedure + limits: project-scaffolding
# docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [comment_ratchet] -- the scaffold's no-history-comments ratchet (fleet-config
# issue #340's audit bucket). The gate (scripts/verify-before-ship.ps1) runs
# scripts/comment_ratchet.py through scripts/comment_ratchet_gate.py: a file
# whose count of `#NNN` issue references inside comments rises above
# .comment-ratchet-baseline.json fails. Existing debt is baselined so it never
# blocks; it just cannot grow. A scan that cannot complete exits 3, which
# fails the gate. Procedure + limits: project-scaffolding docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"

# [structure_ratchet] -- the scaffold's baseline-and-ratchet structure stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/structure_ratchet.py through
# scripts/structure_ratchet_gate.py: a file over 1,000 lines, a Python/JS function over
# 100 lines, a directory over 40 modules, a `src` module importing `app`, or a root
# folder outside the declared `shape` + `extra_roots` above fails, beyond
# .structure-ratchet-baseline.json. Existing offenders are baselined at today's size and
# cannot grow. A tree that cannot be measured exits 3, which fails the gate. Where code
# goes: docs/layout.md. Procedure + limits: project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet instruction stage: the weekly
# prompt audit's deterministic rules over CLAUDE.md, AGENTS.md and the skill files. The gate
# (scripts/verify-before-ship.ps1) runs scripts/instruction_ratchet.py through
# scripts/instruction_ratchet_gate.py: a rule count above .instruction-ratchet-baseline.json,
# or an instruction file past its size cap, fails. Existing hits are baselined and cannot
# grow. A file that cannot be linted exits 3, which fails the gate. Procedure + limits:
# project-scaffolding docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet doc-references stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/doc_refs_ratchet.py through
# scripts/doc_refs_ratchet_gate.py: a repo path, `python -m` module, relative link or loopback
# port named in README.md, CLAUDE.md or docs/**/*.md that does not exist, beyond
# .doc-refs-ratchet-baseline.json, fails. A scan that cannot complete exits 3, which fails the
# gate. allow_refs lists the other services' ports the docs name on purpose. Procedure +
# limits: project-scaffolding docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled  = true
baseline = ".doc-refs-ratchet-baseline.json"
# The hub, whisper, the voice-transcriber and this repo's legacy Streamlit app, which the docs name on purpose.
allow_refs = [":8000", ":8443", ":8501"]

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet dead-code stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/dead_code_ratchet.py through
# scripts/dead_code_ratchet_gate.py: a Python function, class or method that nothing in the
# tracked tree references, beyond .dead-code-ratchet-baseline.json, fails. Route handlers,
# tests, dunders and decorated hooks are entry points; the vendored copies above are read
# for references but never reported. A tree that cannot be parsed exits 3, which fails the
# gate. Procedure + limits: project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet conventions stage: fleet
# conventions held as stdlib `ast` rules. The gate (scripts/verify-before-ship.ps1) runs
# scripts/conventions_ratchet.py through scripts/conventions_ratchet_gate.py: a file whose
# hit count for an enabled rule rises above .conventions-ratchet-baseline.json fails.
# Existing hits are baselined and cannot grow. A tree that cannot be parsed exits 3, which
# fails the gate. Enabled: no-window (a Windows app that spawns subprocesses),
# logging-not-print (app/ and src/ are library code) and no-drive-path. secret-compare and
# git-wrapper stay off: the repo has no constant-time-compare or git helper to route through.
# Procedure + limits: project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled  = true
baseline = ".conventions-ratchet-baseline.json"
rules    = ["no-window", "logging-not-print", "no-drive-path"]

[[design.accepted]]
rule   = "LAYOUT-03"
reason = "Prices rows keep one-tap product links per store as wrapping pills under the picker, the row tap opening the item sheet (#257) — household decision (the #153 round had made them labels)"
record = "https://github.com/ferraroroberto/grocery-shopping-automation/issues/194"

[[design.accepted]]
check  = "glyph-icons"
detail = "3 arrow/shape character(s) drawn as icons in rendered text; use the matching Lucide glyph (design.md Icons): app/static/modules/audio.js:432, app/static/modules/audio.js:450, app/static/modules/audio.js:518"
