# [design.review] -- the rendered design review's walk (fleet-config
# skills/_lib/design_review, docs/skills.md "Two legs, two interpreters").
# The walk clicks the primary tabs, opens every <details> and showModal()s
# every dialog[id] on its own; each extra step below is a click (or a short
# `clicks` sequence) after a fresh load, never a fill or submit, and never on
# or inside a no_go selector. A step whose target is missing on the live app
# (an empty list) is recorded STEP_TARGET_ABSENT and leaves unrelated rules
# alone (fleet-config#995). The live walk runs against the real app and its
# real spreadsheet, so no_go below must cover every control that writes,
# launches, records or spends. `measure --synthetic` instead boots the
# invented-data instance declared in [design.review.synthetic] (#251) and
# walks that one -- every step below runs there too, plus the `synthetic =
# true` ones, which the live walk never runs.
[design.review]
theme_storage_key = "grocery.theme"
# Never clicked: anything that mutates the spreadsheet or local what-if state,
# starts a recording, spends money, or launches an external process/window.
no_go = [
    ".detail-save-btn",                       # every dialog's Save/Apply (login Unlock, Set baseline, Review & apply's Apply, the item sheet's Save, the Add item sheet's Add item)
    '[data-stores-action="review"]',          # Items -> Prices glance: Review & apply
    '[data-stores-action="set-baseline"]',    # Prices -> Benchmark sheet: Set as baseline
    '[data-stores-action="reset-baseline"]',  # Prices -> Benchmark sheet: Reset to benchmark
    '[data-stores-action="import"]',          # Prices -> Benchmark sheet: Import latest run (also its footer primary)
    '[data-stores-action="recommended"]',     # Prices glance + Benchmark sheet: Load recommended plan
    '[data-stores-action="reset"]',           # Prices -> Benchmark sheet: Reset to my list
    "[data-review-checked]",                  # item sheet > Stores & prices: Checked toggle
    "[data-review-reset]",                    # item sheet > Stores & prices: per-store Reset to benchmark
    '.review-edit button[type="submit"]',     # item sheet > Stores & prices: per-store override Save
    "#automation-start",                      # Shop -> carts glance: Fill carts
    '[data-action="current-minus"]',
    '[data-action="current-plus"]',
    '[data-action="target-minus"]',
    '[data-action="target-plus"]',            # Audit's +/- steppers
    '[data-action="mark-buy"]',
    '[data-action="mark-extra"]',             # Shop's "Got it" checkboxes
    '[data-action="remove-extra"]',           # Shop -> store sheet: a quick-add's Remove
    "[data-store-unmark]",                    # Shop -> store sheet: Unmark all
    "[data-sheet-delete]",                    # item sheet: Delete item (opens the confirm)
    '[data-confirm="yes"]',                   # the confirm sheet's Delete
    "#record-toggle",                         # Audit -> Voice: Record
    "#audio-clear",                           # Audit -> Voice -> transcript menu: Clear (wipes a transcript in progress)
    "#search-record",                         # Add item sheet: product-search mic
    "#search-run",                            # Add item sheet: product-search Search
    '[data-action="search-use"]',
    '[data-action="search-confirm"]',         # Add item sheet: product-search Use / Update item
    "#email-check-now",
    "#email-check-test",                      # Settings -> Email watch sheet: Check now / Test last email
    "[data-monitor-sender]",
    "#email-poller-enabled",                  # Settings -> Email watch sheet: the switches (each saves as it changes)
    "#open-sheet",                            # Settings: Open spreadsheet
    "#check-logins",                          # Settings -> Store logins sheet: Check logins (opens Chrome briefly)
    "#bootstrap-session",                     # Settings -> Store logins sheet: Log in to stores (launches a Chrome window)
]

# Audit opens on Voice (#259), which the tab's own screen shows; Manual is
# the second segment. The transcript card's menu opens a sheet holding the
# match model and Clear (no_go); opening it only reads.
[[design.review.extra_steps]]
tab       = "audit"
id        = "manual"
click     = '#pane-audit [data-mode="audit"]'
synthetic = false

[[design.review.extra_steps]]
tab       = "audit"
id        = "transcript-menu"
clicks    = ['#pane-audit [data-mode="audio"]', "#audio-menu"]
synthetic = false

# Items is two segments (#256): the item list ("list") and Prices ("stores").
# Each Items step clicks its segment first -- a sub-mode saved by an earlier
# step must not decide which segment the step lands on.
[[design.review.extra_steps]]
tab       = "items"
id        = "list"
click     = '#pane-items [data-mode="list"]'
synthetic = false

# The Add item sheet the list opens: the product search, then Add by hand.
# Opening it only reads; its Search, mic and Add item are no_go.
[[design.review.extra_steps]]
tab       = "items"
id        = "add"
clicks    = ['#pane-items [data-mode="list"]', "#items-add"]
synthetic = false

[[design.review.extra_steps]]
tab       = "items"
id        = "stores"
click     = '#pane-items [data-mode="stores"]'
synthetic = false

# Prices takes a moment to load its price simulator (GET /api/stores then
# /api/stores/checks) before its rows attach -- relies on the walk's own 5s
# STEP_TARGET_WAIT_MS rather than a hand-added wait. A row tap opens the item
# sheet (#255) on its Stores & prices page (#257).
[[design.review.extra_steps]]
tab       = "items"
id        = "stores-detail"
clicks    = ['#pane-items [data-mode="stores"]', '#pane-items .store-row .action-row-main']
synthetic = false

# The Benchmark sheet (#257) the glance card's footer row opens. Opening it
# only reads; its import, plan and baseline buttons are no_go.
[[design.review.extra_steps]]
tab       = "items"
id        = "stores-benchmark"
clicks    = ['#pane-items [data-mode="stores"]', '[data-stores-action="benchmark"]']
synthetic = false

# The item sheet (#255) every item row opens: its main page (steppers, link
# rows, Delete), and one field page (the Zone picker). Opening it only reads.
[[design.review.extra_steps]]
tab       = "items"
id        = "item-sheet"
clicks    = ['#pane-items [data-mode="list"]', '#pane-items .item-row .action-row-main']
synthetic = false

[[design.review.extra_steps]]
tab       = "items"
id        = "item-sheet-zone"
clicks    = ['#pane-items [data-mode="list"]', '#pane-items .item-row .action-row-main', '#item-sheet [data-page-to="zone"]']
synthetic = false

# Shop's carts glance (#258): its Options row opens the Fill carts options
# sheet, and a store group's Store options row opens the store sheet. Opening
# either only reads; Fill carts itself, Unmark all and Remove are no_go.
[[design.review.extra_steps]]
tab       = "shopping"
id        = "fill-carts-options"
click     = "#automation-options"
synthetic = false

[[design.review.extra_steps]]
tab       = "shopping"
id        = "store-sheet"
clicks    = ["#pane-shopping details[data-store] > summary", "#pane-shopping details[data-store] [data-store-sheet]"]
synthetic = false

# Settings is never a tab (#200): the walk reaches it through the header gear,
# which also puts the text-size control on a screen (A11Y-02).
[[design.review.extra_steps]]
tab       = "inventory"
id        = "settings"
click     = '#pane-inventory .home-settings'
synthetic = false

# Settings' Stores rows open their sheets (#261). Opening either only reads;
# the checks, the logins and the email switches inside are no_go.
[[design.review.extra_steps]]
tab       = "inventory"
id        = "settings-store-logins"
clicks    = ['#pane-inventory .home-settings', "#open-store-logins"]
synthetic = false

[[design.review.extra_steps]]
tab       = "inventory"
id        = "settings-email-watch"
clicks    = ['#pane-inventory .home-settings', "#open-email-watch"]
synthetic = false

# --- the e2e suite as a second walk (fleet-config#1383) ---------------------
# `measure --e2e` runs this suite with the surface() capture hook on
# (tests/e2e/_surface.py, vendored). It boots its own in-thread uvicorn on
# invented fixtures, so there is no live-app guard flag to pass.
[design.review.e2e]
command = ["-m", "pytest", "tests/e2e"]

# --- the synthetic instance (#251) ---------------------------------------
# scripts/design_review_synthetic.py boots a throwaway copy of this checkout on
# invented data (a temp workbook and benchmark runs), with every store, cart,
# Chrome, email, whisper and hub side effect stubbed and guarded -- see that
# script's docstring. Because nothing real is reachable, its no_go lists only
# what would change the invented data mid-walk (so screens stay comparable
# across runs) or needs hardware: the Audit steppers and checkboxes, every
# Save/Apply, the Stores baseline/import/reset buttons, and the microphones.
# Run automation, Check now/Test, Open spreadsheet, Log in to stores and Check
# logins are stubbed and walkable here. Product-search results are not
# reached: the walk never types, and the search needs text.
[design.review.synthetic]
command = ["scripts/design_review_synthetic.py"]
startup_timeout_s = 180
no_go = [
    ".detail-save-btn",                       # every dialog's Save/Apply
    '[data-stores-action="set-baseline"]',
    '[data-stores-action="reset-baseline"]',
    '[data-stores-action="import"]',
    '[data-stores-action="reset"]',
    "[data-review-checked]",
    "[data-review-reset]",
    '.review-edit button[type="submit"]',
    '[data-action="current-minus"]',
    '[data-action="current-plus"]',
    '[data-action="target-minus"]',
    '[data-action="target-plus"]',
    '[data-action="mark-buy"]',
    '[data-action="mark-extra"]',
    '[data-action="remove-extra"]',
    "[data-store-unmark]",
    "[data-sheet-delete]",
    '[data-confirm="yes"]',
    '[data-action="search-use"]',
    '[data-action="search-confirm"]',
    "#record-toggle",                         # needs a microphone
    "#audio-clear",
    "#search-record",
]

[[design.review.extra_steps]]
tab       = "shopping"
id        = "fill-carts-run"
click     = "#automation-start"
synthetic = true

[[design.review.extra_steps]]
tab       = "items"
id        = "stores-review"
clicks    = ['#pane-items [data-mode="stores"]', '[data-stores-action="recommended"]', '[data-stores-action="review"]']
synthetic = true

[[design.review.extra_steps]]
tab       = "inventory"
id        = "settings-email-check"
clicks    = ['#pane-inventory .home-settings', "#open-email-watch", "#email-check-now"]
synthetic = true

# The stubbed check reports into the Store logins sheet, never a toast (#261).
[[design.review.extra_steps]]
tab       = "inventory"
