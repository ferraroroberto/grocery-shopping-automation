[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q
markers =
    e2e: end-to-end Playwright tests that drive a real browser
    live: tests that hit the real local LLM hub / whisper-server (opt-in)
    windows_only: needs Windows-desktop state (PowerShell, tray, toasts); the Mac nightly deselects it with -m "not windows_only"
